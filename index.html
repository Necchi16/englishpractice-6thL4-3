<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夏休みの思い出スライド</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .font-note { font-family: 'Nunito', 'Zen Maru Gothic', sans-serif; letter-spacing: 0.05em; }
    .slide-bg { background: linear-gradient(135deg, #111 0%, #222 100%); }
    
    /* 画面揺れアニメーション */
    .shake-animation { animation: shake 0.5s; }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
  </style>
</head>
<body class="bg-blue-50 font-sans touch-manipulation">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // --- 定数定義 ---
    const SUGGESTIONS = {
      wentTo: ['うみ', 'おばあちゃんのいえ', 'ゆうえんち', 'キャンプ', 'プール', 'やま', 'としょかん'],
      enjoyed: ['すいえい', 'ゲーム', 'むしとり', 'バーベキュー', 'はなび', 'しゅくだい', 'どくしょ'],
      saw: ['はなび', 'ひまわり', 'かぶとむし', 'おまつり', 'うみ', 'ともだち'],
      ate: ['かきごおり', 'スイカ', 'そうめん', 'カレー', 'アイスクリーム', 'おすし'],
      itWas: [
        "おなじ (same)", "ちがう (different)", "ながい (long)", "みじかい (short)",
        "はやい (fast)", "おそい (slow)", "すばらしい (amazing)", "うつくしい (beautiful)",
        "かっこいい (cool)", "わくわくした (exciting)", "ゆうめいな (famous)",
        "すばらしい (fantastic)", "おきにいり (favorite)", "たのしい (fun)",
        "よい (good)", "すごくいい (great)", "おもしろい (interesting)",
        "いいね (nice)", "ピカピカの (shiny)", "すてきな (wonderful)"
      ]
    };

    const ITEM_LABELS = {
      wentTo: { icon: '🚶‍♂️', title: 'どこに 行った？', enHint: '(went to)', prefix: 'I went to ' },
      enjoyed: { icon: '✨', title: 'なにを 楽しんだ？', enHint: '(enjoyed)', prefix: 'I enjoyed ' },
      saw: { icon: '👀', title: 'なにを 見た？', enHint: '(saw)', prefix: 'I saw ' },
      ate: { icon: '🍎', title: 'なにを 食べた？', enHint: '(ate)', prefix: 'I ate ' },
      itWas: { icon: '💭', title: 'どんな かんそう（気持ち）？', enHint: '(It was)', prefix: 'It was ' }
    };

    const KUMMANI_STAGES = [
      { id: 1, name: "コグマニ", emoji: "🧸", reqExp: 0 },
      { id: 2, name: "クッマーニ", emoji: "🐻", reqExp: 3 },
      { id: 3, name: "シロクッマーニ", emoji: "🐻‍❄️", reqExp: 8 },
      { id: 4, name: "パンダニ", emoji: "🐼", reqExp: 15 },
      { id: 5, name: "メカ・クッマーニ", emoji: "🤖", reqExp: 25 },
      { id: 6, name: "キング・クッマーニ", emoji: "👑", reqExp: 40 },
      { id: 7, name: "ドラゴン・クッマーニ", emoji: "🐉", reqExp: 55 },
      { id: 8, name: "ゴースト・クッマーニ", emoji: "👻", reqExp: 70 },
      { id: 9, name: "エイリアン・クッマーニ", emoji: "👽", reqExp: 90 }
    ];

    const DISHES = [
      "🍙 シャケの ほくほく おにぎり", 
      "🐟 こんがり 焼きジャケ", 
      "🍲 シャケの クリームシチュー", 
      "🍤 とくせい サーモンフライ",
      "🍣 ピカピカ サーモンのおすし", 
      "🍝 シャケと きのきの パスタ", 
      "🍔 シャケの ボリュームバーガー", 
      "🍕 とろーり サーモンピザ",
      "🥗 シャケの ヘルシーサラダ",
      "🥪 シャケたま サンドイッチ",
      "🍛 ごろごろ シャケカレー",
      "🍱 ごうか シャケ弁当"
    ];

    const GAS_URLS = [
      "https://script.google.com/macros/s/AKfycbweESd0ikrHJl6Pl5lPnniXgoUWW45_YDUIAXuCBYKkclBs3T47GX83B5q-GAc8Hw3sPQ/exec",
      "https://script.google.com/a/macros/s.kansai.soka.ed.jp/s/AKfycbyWmVjVU2MWqugLvwaal9Gp768JDQX_ZywK3SyPjpsClR_AaSf9FHR6FPJHVekinpQiUQ/exec",
      "https://script.google.com/macros/s/AKfycbz6Jeiu5yDwBOwWpAIicyXdWqtaT-qT7KjP59DU3b7IkP3eDucpggHW1Fxrm2xBbsQL/exec"
    ];

    // --- ミニゲーム コンポーネント ---
    const CoinGame = ({ onFinish }) => {
      const canvasRef = useRef(null);
      const [timeLeft, setTimeLeft] = useState(30);
      const requestRef = useRef();
      
      const stateRef = useRef({
        player: { x: 150, y: 150, size: 30, speed: 4, frozenFrames: 0 },
        coins: [],
        monsters: [],
        keys: {},
        score: 0,
        width: 300,
        height: 400,
        isPlaying: true
      });

      useEffect(() => {
        // キャンバスサイズを調整
        const w = window.innerWidth > 500 ? 500 : window.innerWidth - 40;
        stateRef.current.width = w;
        
        // 初期配置
        for(let i=0; i<5; i++) spawnCoin();
        for(let i=0; i<2; i++) spawnMonster(); // モンスターも初期配置
        
        const handleKeyDown = (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { stateRef.current.keys[e.key] = true; e.preventDefault(); }};
        const handleKeyUp = (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { stateRef.current.keys[e.key] = false; e.preventDefault(); }};
        window.addEventListener('keydown', handleKeyDown, {passive: false});
        window.addEventListener('keyup', handleKeyUp);
        
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if(prev <= 1) {
              clearInterval(timer);
              stateRef.current.isPlaying = false;
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        const loop = () => {
          if(!stateRef.current.isPlaying) return;
          update();
          draw();
          requestRef.current = requestAnimationFrame(loop);
        };
        requestRef.current = requestAnimationFrame(loop);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
          clearInterval(timer);
          cancelAnimationFrame(requestRef.current);
        };
      }, []);

      useEffect(() => {
        if(timeLeft === 0) {
          onFinish(stateRef.current.score);
        }
      }, [timeLeft, onFinish]);

      const spawnCoin = () => {
        const { width, height } = stateRef.current;
        stateRef.current.coins.push({
          x: Math.random() * (width - 40) + 20,
          y: Math.random() * (height - 40) + 20,
          size: 20
        });
      };

      const spawnMonster = () => {
        const { width, height } = stateRef.current;
        stateRef.current.monsters.push({
          x: Math.random() * (width - 60) + 30,
          y: Math.random() * (height - 60) + 30,
          size: 35,
          dx: (Math.random() - 0.5) * 5, // ランダムな速度と方向
          dy: (Math.random() - 0.5) * 5
        });
      };

      const update = () => {
        const state = stateRef.current;
        const { player, coins, monsters, keys, width, height } = state;

        // フリーズ状態の処理
        if (player.frozenFrames > 0) {
          player.frozenFrames--;
        } else {
          // 移動処理
          let dx = 0, dy = 0;
          if (keys['ArrowUp']) dy -= player.speed;
          if (keys['ArrowDown']) dy += player.speed;
          if (keys['ArrowLeft']) dx -= player.speed;
          if (keys['ArrowRight']) dx += player.speed;
          
          player.x += dx;
          player.y += dy;
          
          // 壁判定
          player.x = Math.max(player.size/2, Math.min(width - player.size/2, player.x));
          player.y = Math.max(player.size/2, Math.min(height - player.size/2, player.y));
        }

        // モンスターの移動と壁反射
        monsters.forEach(m => {
          m.x += m.dx;
          m.y += m.dy;
          if (m.x < m.size/2 || m.x > width - m.size/2) m.dx *= -1;
          if (m.y < m.size/2 || m.y > height - m.size/2) m.dy *= -1;

          // プレイヤーとの当たり判定
          if (player.frozenFrames === 0) {
            const dist = Math.hypot(player.x - m.x, player.y - m.y);
            if (dist < (player.size + m.size) / 2 - 5) {
              // 衝突！フリーズさせる
              player.frozenFrames = 60; // 約1秒間フリーズ (60fps想定)
              
              // 画面を揺らす
              const canvas = canvasRef.current;
              if(canvas) {
                canvas.classList.add('shake-animation');
                setTimeout(() => canvas.classList.remove('shake-animation'), 500);
              }
            }
          }
        });

        // コインの取得判定
        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          const dist = Math.hypot(player.x - c.x, player.y - c.y);
          if (dist < (player.size + c.size) / 2) {
            coins.splice(i, 1);
            state.score++;
            spawnCoin();
            // コインを5枚取るごとにモンスターを増やす
            if (state.score % 5 === 0) spawnMonster();
          }
        }
      };

      const draw = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const state = stateRef.current;

        ctx.clearRect(0, 0, state.width, state.height);
        
        // 背景のグリッド（オプショナル）
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for(let i=0; i<state.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, state.height); ctx.stroke(); }
        for(let i=0; i<state.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(state.width, i); ctx.stroke(); }

        // コイン描画
        state.coins.forEach(c => {
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.size/2, 0, Math.PI * 2);
          ctx.fillStyle = '#fbbf24';
          ctx.fill();
          ctx.strokeStyle = '#d97706';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#d97706';
          ctx.font = '12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('¥', c.x, c.y);
        });

        // モンスター描画
        state.monsters.forEach(m => {
          ctx.font = `${m.size}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('👾', m.x, m.y);
        });

        // プレイヤー描画
        const p = state.player;
        ctx.globalAlpha = p.frozenFrames > 0 && Math.floor(p.frozenFrames / 10) % 2 === 0 ? 0.5 : 1.0; // フリーズ中は点滅
        ctx.font = `${p.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('👦', p.x, p.y);
        ctx.globalAlpha = 1.0;
        
        // フリーズ中のエフェクト
        if(p.frozenFrames > 0) {
          ctx.fillStyle = 'red';
          ctx.font = '24px Arial bold';
          ctx.fillText('💥', p.x, p.y - p.size);
        }
      };

      const handleBtn = (key, isDown) => {
        stateRef.current.keys[key] = isDown;
      };

      return (
        <div className="flex flex-col items-center bg-gray-900 p-4 rounded-3xl border-4 border-gray-700 shadow-2xl touch-none">
          <div className="flex justify-between w-full mb-4 px-2">
            <div className="text-xl font-bold text-white bg-gray-800 px-4 py-1 rounded-full border-2 border-gray-600">⏳ {timeLeft}</div>
            <div className="text-xl font-bold text-yellow-400 bg-gray-800 px-4 py-1 rounded-full border-2 border-gray-600">🪙 {stateRef.current.score}</div>
          </div>
          <div className="bg-gray-800 rounded-xl overflow-hidden shadow-inner">
            <canvas ref={canvasRef} width={stateRef.current.width} height={stateRef.current.height} />
          </div>
          
          {/* モバイル用コントローラー */}
          <div className="grid grid-cols-3 gap-2 mt-4 md:hidden w-full max-w-[250px]">
            <div />
            <button onPointerDown={() => handleBtn('ArrowUp', true)} onPointerUp={() => handleBtn('ArrowUp', false)} onPointerLeave={() => handleBtn('ArrowUp', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">⬆️</button>
            <div />
            <button onPointerDown={() => handleBtn('ArrowLeft', true)} onPointerUp={() => handleBtn('ArrowLeft', false)} onPointerLeave={() => handleBtn('ArrowLeft', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">⬅️</button>
            <button onPointerDown={() => handleBtn('ArrowDown', true)} onPointerUp={() => handleBtn('ArrowDown', false)} onPointerLeave={() => handleBtn('ArrowDown', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">⬇️</button>
            <button onPointerDown={() => handleBtn('ArrowRight', true)} onPointerUp={() => handleBtn('ArrowRight', false)} onPointerLeave={() => handleBtn('ArrowRight', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">➡️</button>
          </div>
          <p className="text-gray-400 mt-4 text-sm text-center font-bold">やじるしキー（または ボタン）で うごかして コインを あつめよう！<br/>エイリアン👾に ぶつかると しばらく うごけないよ！</p>
        </div>
      );
    };

    function App() {
      const [step, setStep] = useState('HOME'); 
      const [totalCoins, setTotalCoins] = useState(0);
      const [items, setItems] = useState({ salmon: 0 });
      const [kummaniLevel, setKummaniLevel] = useState(1);
      const [kummaniExp, setKummaniExp] = useState(0);
      
      const [inputs, setInputs] = useState({ wentTo: '', enjoyed: '', saw: '', ate: '', itWas: '' });
      const [answers, setAnswers] = useState({});
      const [translatingState, setTranslatingState] = useState({});
      const [fallbackMode, setFallbackMode] = useState({});
      const [manualInputs, setManualInputs] = useState({});
      
      const [savedWorks, setSavedWorks] = useState([]);
      const [viewingWork, setViewingWork] = useState(null);
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

      const [currentSpeakLine, setCurrentSpeakLine] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [feedbackMsg, setFeedbackMsg] = useState("");
      const [failCount, setFailCount] = useState(0); // For skipping speech practice
      
      const [feedEffect, setFeedEffect] = useState(null);
      const [purchaseEffect, setPurchaseEffect] = useState(null);
      const [showNoteConfirm, setShowNoteConfirm] = useState(false); 
      const [lastEarnedCoins, setLastEarnedCoins] = useState(0);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      useEffect(() => {
        const load = (key, setter, isObj = false) => {
          const val = localStorage.getItem(key);
          if (val) setter(isObj ? JSON.parse(val) : parseInt(val, 10));
        };
        load('englishAppCoins_S', setTotalCoins);
        load('englishAppItems_S', setItems, true);
        load('englishAppKummaniLevel_S', setKummaniLevel);
        load('englishAppKummaniExp_S', setKummaniExp);
        load('englishAppWorks_S', setSavedWorks, true);
      }, []);

      const saveProgress = (newCoins, newItems, newLevel, newExp) => {
        localStorage.setItem('englishAppCoins_S', newCoins.toString());
        localStorage.setItem('englishAppItems_S', JSON.stringify(newItems));
        localStorage.setItem('englishAppKummaniLevel_S', newLevel.toString());
        localStorage.setItem('englishAppKummaniExp_S', newExp.toString());
        setTotalCoins(newCoins); setItems(newItems); setKummaniLevel(newLevel); setKummaniExp(newExp);
      };

      const saveWork = (workData) => {
        const newWorks = [workData, ...savedWorks];
        localStorage.setItem('englishAppWorks_S', JSON.stringify(newWorks));
        setSavedWorks(newWorks);
      };

      const speak = useCallback((text) => {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = 0.9;
        synth.speak(utterThis);
      }, [synth]);

      // 英語テキストのクリーニング
      const cleanTrans = (text, type) => {
        if (!text) return "";
        let s = text.trim();
        s = s.replace(/[\.\,\!]+$/, "").trim(); 
        if (type === 'wentTo') s = s.replace(/^i went to /i, "").replace(/^i visited /i, "");
        if (type === 'enjoyed') s = s.replace(/^i enjoyed /i, "").replace(/^i had fun /i, "");
        if (type === 'saw') s = s.replace(/^i saw /i, "").replace(/^i watched /i, "");
        if (type === 'ate') s = s.replace(/^i ate /i, "").replace(/^i had /i, "");
        if (type === 'itWas') s = s.replace(/^it was /i, "").replace(/^they were /i, "").replace(/^that was /i, "").replace(/^it is /i, "").replace(/^that is /i, "");
        return s.trim() || "something";
      };

      // 大文字にするヘルパー
      const capitalizeFirstLetter = (string) => {
        if (!string) return "";
        return string.charAt(0).toUpperCase() + string.slice(1);
      };

      const translateWithGAS = async (text) => {
        const urls = [...GAS_URLS].sort(() => 0.5 - Math.random());
        for (const url of urls) {
          try {
            const res = await Promise.race([
              fetch(`${url}?text=${encodeURIComponent(text)}`),
              new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000))
            ]);
            
            if (!res.ok) continue;
            
            const textData = await res.text();
            try {
              const data = JSON.parse(textData);
              if (data && data.text) return data.text; // toLowerCaseを削除
            } catch (e) {
              console.warn("GAS returned non-JSON response.");
            }
          } catch (e) {
            console.warn("GAS translation failed, trying next...");
          }
        }
        
        console.warn("Falling back to Google Translate API...");
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=en&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0][0][0]; // toLowerCaseを削除
      };

      const handleTranslateSingle = async (k) => {
        if (!inputs[k].trim()) {
          alert("にゅうりょく してね！");
          return;
        }
        
        setTranslatingState(prev => ({ ...prev, [k]: true }));
        setFallbackMode(prev => ({ ...prev, [k]: false }));
        
        let prefix = "私は";
        let suffix = "に行きました。";
        if (k === 'enjoyed') suffix = "を楽しみました。";
        if (k === 'saw') suffix = "を見ました。";
        if (k === 'ate') suffix = "を食べました。";
        if (k === 'itWas') { prefix = "それは"; suffix = "でした。"; }
        
        const cleanJa = inputs[k].replace(/\s*\(.*?\)\s*/g, ""); 
        const query = `${prefix}${cleanJa}${suffix}`;

        try {
          const enText = await translateWithGAS(query);
          const cleaned = cleanTrans(enText, k);
          setAnswers(prev => ({ ...prev, [k]: { ja: inputs[k], en: cleaned, img: "" } }));
          setTranslatingState(prev => ({ ...prev, [k]: false }));
        } catch (err) {
          setFallbackMode(prev => ({ ...prev, [k]: true }));
          setTranslatingState(prev => ({ ...prev, [k]: false }));
        }
      };

      const copyToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          alert('コピーしました！Googleほんやく に はりつけてね。');
        } catch (err) {
          alert('コピーにしっぱいしました。');
        }
        document.body.removeChild(textArea);
      };

      const startListening = (targetWord, index) => {
        if (!SpeechRecognition) return alert("マイクが使えません。");
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        setIsListening(true);
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const trans = event.results[0][0].transcript.toLowerCase();
          const target = targetWord.split(' ')[0].toLowerCase(); 
          
          // 一致率（70%程度）の簡易判定
          let matchCount = 0;
          const minLen = Math.min(trans.length, target.length);
          const maxLen = Math.max(trans.length, target.length);
          for(let i=0; i<minLen; i++){
            if(trans[i] === target[i]) matchCount++;

            setFailCount(0);

              setFeedbackMsg("");
              setCurrentSpeakLine(c => c + 1);
            }, 1500);

            setFailCount(c => c + 1);
            setFeedbackMsg("おしい！もう一度！\n(" + trans + " と聞こえました)");
          }
        };
        recognition.onerror = () => { 
          setFailCount(c => c + 1);
          setFeedbackMsg("エラーがおきました。もう一度ボタンをおしてね。");

        const isAllDone = currentSpeakLine >= keys.length;
        
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-green-300 text-center mt-8">
              <h2 className="text-3xl font-bold text-green-700 mb-6">🗣️ えいごで はなす れんしゅう</h2>
              <div className="space-y-4 mb-8">
                {keys.map((k, idx) => {
                  const isActive = idx === currentSpeakLine;
                  const isDone = idx < currentSpeakLine;
                  const sentence = capitalizeFirstLetter(`${ITEM_LABELS[k].prefix}${answers[k].en}.`);
                  return (
                    <div key={k} className={`p-4 rounded-xl border-2 text-left flex justify-between items-center transition-all ${isActive ? 'bg-green-100 border-green-400 transform scale-105 shadow-md' : isDone ? 'bg-gray-100 border-gray-200 opacity-50' : 'bg-white border-gray-200 opacity-40'}`}>
                      <span className={`text-xl md:text-2xl font-bold font-note ${isDone ? 'line-through text-gray-500' : 'text-gray-800'}`}>{idx+1}. {sentence}</span>
                      {isActive && <button onClick={() => speak(sentence)} className="bg-white p-3 rounded-full text-green-600 shadow border border-green-200">🔊</button>}
                      {isDone && <span className="text-green-500 text-3xl">✓</span>}
                    </div>
                  );
                })}
              </div>

              {!isAllDone ? (
                <div>
                  <button onClick={() => startListening(`${answers[keys[currentSpeakLine]].en}`, currentSpeakLine)} disabled={isListening} className={`w-24 h-24 rounded-full shadow-lg text-4xl mb-4 ${isListening ? 'bg-red-500 animate-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white transition`}>🎤</button>
                  <p className="font-bold text-gray-600">{isListening ? "はなしてね..." : "マイクをおして はなす"}</p>
                  {feedbackMsg && <div className="mt-4 p-4 rounded-xl font-bold text-lg border-2 bg-white whitespace-pre-line">{feedbackMsg}</div>}
                  
                  {failCount >= 2 && (
                    <div className="mt-6 animate-fade-in-up">
                        <p className="text-sm text-gray-500 mb-2 font-bold">むずかしい場合はスキップできます。</p>
                        <button onClick={() => { setCurrentSpeakLine(c => c+1); setFailCount(0); setFeedbackMsg(""); }} className="text-sm bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-full font-bold transition text-gray-700 shadow-sm border border-gray-300">⏭️ スキップして次へ</button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="animate-bounce-in">
                  <p className="text-2xl font-bold text-orange-500 mb-6">ぜんぶ 言えたね！🎉</p>
                  <button onClick={handleFinishAll} className="w-full bg-yellow-500 hover:bg-yellow-600 text-yellow-900 text-2xl font-bold py-6 rounded-2xl shadow-xl transition transform hover:scale-105 flex items-center justify-center gap-2"><span>🎮</span> ゲームへ！ ▶️</button>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'GAME_INTRO') {
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center relative">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-green-200">
              <h2 className="text-3xl font-bold text-green-600 mb-6">コインあつめ ゲーム！</h2>
              <div className="bg-green-100 p-6 rounded-2xl mb-8">
                <div className="text-6xl mb-4 flex justify-center items-center gap-2">
                  <span>🪙</span>
                  <span className="animate-bounce">{currentStage.emoji}</span>
                </div>
                <p className="text-lg font-bold text-gray-700 leading-relaxed text-left bg-white p-4 rounded-xl shadow-sm">
                  えいごの 練習 おつかれさま！<br/>ゲームだよ。<br/>
                  <br/>
                  やじるしキー や ボタンを おして<br/>
                  <span className="text-blue-600">{currentStage.name}</span> を うごかそう！<br/>
                  <br/>
                  エイリアン（👾）に ぶつかると<br/>
                  しばらく うごけなくなるよ！
                </p>
              </div>
              <button onClick={() => setStep('GAME')} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-md w-full transition transform hover:scale-105">スタート！</button>
            </div>
          </div>
        );
      } else if (step === 'GAME') {
         content = (
           <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 relative">
              <CoinGame onFinish={handleGameFinish} />
           </div>
         );
      } else if (step === 'GAME_RESULT') {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-yellow-200 text-center animate-fade-in-up">
              <h2 className="text-3xl font-bold text-yellow-600 mb-6">ゲーム おつかれさま！</h2>
              <div className="text-6xl mb-6">🎉</div>
              <p className="text-2xl font-bold text-gray-700 mb-4">あつめたコイン: <span className="text-yellow-500 text-4xl">{lastEarnedCoins}</span></p>
              <p className="text-lg font-bold text-gray-500 mb-8">ぜんぶで {totalCoins} コインになったよ！</p>
              
              <button onClick={() => { setStep('VIEW_SLIDESHOW'); setCurrentSlideIndex(0); }} className="bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-5 px-8 rounded-full flex items-center justify-center mx-auto shadow-md transform transition hover:scale-105 w-full">
                 スライドを みる！ ▶️
              </button>
            </div>
          </div>
        );
      } else if (step === 'VIEW_SLIDESHOW') {
        const workData = viewingWork;
        const keys = ['wentTo', 'enjoyed', 'saw', 'ate', 'itWas'];
        const k = keys[currentSlideIndex];
        const sentence = capitalizeFirstLetter(`${ITEM_LABELS[k].prefix}${workData.answers[k].en}.`);
        
        content = (
          <div className="fixed inset-0 bg-black flex flex-col z-50">
            <div className="flex-1 flex items-center justify-center p-2 md:p-6 overflow-hidden min-h-0">
              <div 
                className="w-full h-full max-w-4xl max-h-[75vh] slide-bg rounded-xl md:rounded-3xl shadow-[0_0_30px_rgba(0,0,0,0.8)] overflow-hidden relative flex flex-col mx-auto bg-gray-900 border-4 border-gray-800"
              >
                <button onClick={() => { setStep('HOME'); setViewingWork(null); }} className="absolute top-4 left-4 bg-black/70 text-white px-4 py-2 rounded-full font-bold z-20 hover:bg-black/90 border border-gray-600 backdrop-blur">✖ とじる</button>
                <button onClick={() => speak(sentence)} className="absolute top-4 right-4 bg-blue-500/90 text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg z-20 hover:bg-blue-600 border-2 border-white backdrop-blur">🔊</button>
                
                <div className="flex-1 w-full relative flex flex-col justify-end bg-black">
                  {/* 画像表示エリア（絶対配置で画面全体に） */}
                  <div className="absolute inset-0 flex items-center justify-center">
                    {workData.answers[k].img ? (
                      <img src={workData.answers[k].img} alt="slide" onError={(e) => {e.target.src="https://placehold.co/800x600/222222/ff3333?text=Error:+Cannot+load+image.\nPlease+try+another+URL.";}} className="w-full h-full object-contain" />
                    ) : (
                      <div className="text-gray-500 font-bold text-2xl">がぞう は ありません</div>
                    )}
                  </div>
                  
                  {/* スライド下部のテキストエリア（パディングを調整して文字切れを防止、確実に最前面に） */}
                  <div className="relative w-full bg-gradient-to-t from-black via-black/80 to-transparent px-4 pt-20 pb-8 flex flex-col items-center text-center z-10 pointer-events-none">
                    <p className="text-white text-2xl md:text-4xl font-bold font-note drop-shadow-lg leading-tight mb-2">{sentence}</p>
                    <p className="text-gray-300 text-base md:text-xl font-bold drop-shadow-md">({workData.answers[k].ja})</p>
                  </div>
                </div>
              </div>
            </div>
            
            <div className="h-20 bg-gray-950 flex justify-between items-center px-4 md:px-12 shrink-0 border-t border-gray-800">
              <button onClick={() => setCurrentSlideIndex(Math.max(0, currentSlideIndex - 1))} className={`text-white text-3xl md:text-4xl p-2 md:p-4 transition ${currentSlideIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:scale-110 active:scale-95'}`}>◀</button>
              
              <div className="flex gap-3">
                {keys.map((_, i) => (
                  <div key={i} className={`w-3 h-3 md:w-4 md:h-4 rounded-full transition-colors ${i === currentSlideIndex ? 'bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)]' : 'bg-gray-700'}`} />
                ))}
              </div>

              <button onClick={() => setCurrentSlideIndex(Math.min(keys.length - 1, currentSlideIndex + 1))} className={`text-white text-3xl md:text-4xl p-2 md:p-4 transition ${currentSlideIndex === keys.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:scale-110 active:scale-95'}`}>▶</button>
            </div>
          </div>
        );
      } else if (step === 'VIEW_WORKSHEET' && viewingWork) {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-yellow-300 relative mt-8">
              <h2 className="text-2xl font-bold text-gray-700 mb-6">📑 {viewingWork.date} のノート</h2>
              <div className="bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] bg-white border-2 border-gray-300 p-6 md:p-10 rounded-xl shadow-inner mb-4">
                {renderNoteLines(viewingWork.answers, false)}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen relative font-sans touch-manipulation">
          {content}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
