<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夏休みの思い出スライド</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .font-note { font-family: 'Nunito', 'Zen Maru Gothic', sans-serif; letter-spacing: 0.05em; }
    .slide-bg { background: linear-gradient(135deg, #111 0%, #222 100%); }
  </style>
</head>
<body class="bg-blue-50 font-sans touch-manipulation">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const SUGGESTIONS = {
      wentTo: ['うみ', 'おばあちゃんのいえ', 'ゆうえんち', 'キャンプ', 'プール', 'やま', 'としょかん'],
      enjoyed: ['すいえい', 'ゲーム', 'むしとり', 'バーベキュー', 'はなび', 'しゅくだい', 'どくしょ'],
      saw: ['はなび', 'ひまわり', 'かぶとむし', 'おまつり', 'うみ', 'ともだち'],
      ate: ['かきごおり', 'スイカ', 'そうめん', 'カレー', 'アイスクリーム', 'おすし'],
      itWas: [
        "おなじ (same)", "ちがう (different)", "ながい (long)", "みじかい (short)",
        "はやい (fast)", "おそい (slow)", "すばらしい (amazing)", "うつくしい (beautiful)",
        "かっこいい (cool)", "わくわくした (exciting)", "ゆうめいな (famous)",
        "すばらしい (fantastic)", "おきにいり (favorite)", "たのしい (fun)",
        "よい (good)", "すごくいい (great)", "おもしろい (interesting)",
        "いいね (nice)", "ピカピカの (shiny)", "すてきな (wonderful)"
      ]
    };

    const ITEM_LABELS = {
      wentTo: { icon: '🚶‍♂️', title: 'どこに 行った？', enHint: '(went to)', prefix: 'I went to ' },
      enjoyed: { icon: '✨', title: 'なにを 楽しんだ？', enHint: '(enjoyed)', prefix: 'I enjoyed ' },
      saw: { icon: '👀', title: 'なにを 見た？', enHint: '(saw)', prefix: 'I saw ' },
      ate: { icon: '🍎', title: 'なにを 食べた？', enHint: '(ate)', prefix: 'I ate ' },
      itWas: { icon: '💭', title: 'どんな かんそう（気持ち）？', enHint: '(It was)', prefix: 'It was ' }
    };

    const KUMMANI_STAGES = [
      { id: 1, name: "コグマニ", emoji: "🧸", reqExp: 0 },
      { id: 2, name: "クッマーニ", emoji: "🐻", reqExp: 3 },
      { id: 3, name: "シロクッマーニ", emoji: "🐻‍❄️", reqExp: 8 },
      { id: 4, name: "パンダニ", emoji: "🐼", reqExp: 15 },
      { id: 5, name: "メカ・クッマーニ", emoji: "🤖", reqExp: 25 },
      { id: 6, name: "キング・クッマーニ", emoji: "👑", reqExp: 40 },
      { id: 7, name: "ドラゴン・クッマーニ", emoji: "🐉", reqExp: 55 },
      { id: 8, name: "ゴースト・クッマーニ", emoji: "👻", reqExp: 70 },
      { id: 9, name: "エイリアン・クッマーニ", emoji: "👽", reqExp: 90 }
    ];

    const DISHES = [
      "🍙 シャケのおにぎり", "🐟 焼きジャケ", "🍲 シチュー", "🍤 フライ",
      "🍣 おすし", "🍝 パスタ", "🍔 バーガー", "🍕 ピザ"
    ];

    const GAS_URLS = [
      "https://script.google.com/macros/s/AKfycbweESd0ikrHJl6Pl5lPnniXgoUWW45_YDUIAXuCBYKkclBs3T47GX83B5q-GAc8Hw3sPQ/exec",
      "https://script.google.com/a/macros/s.kansai.soka.ed.jp/s/AKfycbyWmVjVU2MWqugLvwaal9Gp768JDQX_ZywK3SyPjpsClR_AaSf9FHR6FPJHVekinpQiUQ/exec",
      "https://script.google.com/macros/s/AKfycbz6Jeiu5yDwBOwWpAIicyXdWqtaT-qT7KjP59DU3b7IkP3eDucpggHW1Fxrm2xBbsQL/exec"
    ];

    function App() {
      const [step, setStep] = useState('HOME'); 
      const [totalCoins, setTotalCoins] = useState(0);
      const [items, setItems] = useState({ salmon: 0 });
      const [kummaniLevel, setKummaniLevel] = useState(1);
      const [kummaniExp, setKummaniExp] = useState(0);
      
      const [inputs, setInputs] = useState({ wentTo: '', enjoyed: '', saw: '', ate: '', itWas: '' });
      const [answers, setAnswers] = useState({});
      const [translatingState, setTranslatingState] = useState({});
      const [manualInputs, setManualInputs] = useState({});
      const abortControllers = useRef({});
      
      const [savedWorks, setSavedWorks] = useState([]);
      const [viewingWork, setViewingWork] = useState(null);
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

      const [currentSpeakLine, setCurrentSpeakLine] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [feedbackMsg, setFeedbackMsg] = useState("");
      const [failCount, setFailCount] = useState(0);
      
      const [feedEffect, setFeedEffect] = useState(null);
      const [showNoteConfirm, setShowNoteConfirm] = useState(false); // ノート確認画面用

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      useEffect(() => {
        const load = (key, setter, isObj = false) => {
          const val = localStorage.getItem(key);
          if (val) setter(isObj ? JSON.parse(val) : parseInt(val, 10));
        };
        load('englishAppCoins_S', setTotalCoins);
        load('englishAppItems_S', setItems, true);
        load('englishAppKummaniLevel_S', setKummaniLevel);
        load('englishAppKummaniExp_S', setKummaniExp);
        load('englishAppWorks_S', setSavedWorks, true);
      }, []);

      const saveProgress = (newCoins, newItems, newLevel, newExp) => {
        localStorage.setItem('englishAppCoins_S', newCoins.toString());
        localStorage.setItem('englishAppItems_S', JSON.stringify(newItems));
        localStorage.setItem('englishAppKummaniLevel_S', newLevel.toString());
        localStorage.setItem('englishAppKummaniExp_S', newExp.toString());
        setTotalCoins(newCoins); setItems(newItems); setKummaniLevel(newLevel); setKummaniExp(newExp);
      };

      const saveWork = (workData) => {
        const newWorks = [workData, ...savedWorks];
        localStorage.setItem('englishAppWorks_S', JSON.stringify(newWorks));
        setSavedWorks(newWorks);
      };

      const speak = useCallback((text) => {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = 0.9;
        synth.speak(utterThis);
      }, [synth]);

      // 英語テキストのクリーニング（大文字小文字は保持し、プレフィックスだけ削る）
      const cleanTrans = (text, type) => {
        if (!text) return "";
        let s = text.trim();
        s = s.replace(/[\.\,\!]+$/, "").trim(); // 末尾のピリオドなどを削除
        // 大文字小文字無視（/i）でプレフィックスを削除
        if (type === 'wentTo') s = s.replace(/^i went to /i, "").replace(/^i visited /i, "");
        if (type === 'enjoyed') s = s.replace(/^i enjoyed /i, "").replace(/^i had fun /i, "");
        if (type === 'saw') s = s.replace(/^i saw /i, "").replace(/^i watched /i, "");
        if (type === 'ate') s = s.replace(/^i ate /i, "").replace(/^i had /i, "");
        if (type === 'itWas') s = s.replace(/^it was /i, "").replace(/^they were /i, "").replace(/^that was /i, "").replace(/^it is /i, "").replace(/^that is /i, "");
        
        return s.trim() || "something";
      };

      const capitalizeFirstLetter = (string) => {
        if (!string) return "";
        return string.charAt(0).toUpperCase() + string.slice(1);
      };

      const translateWithGAS = async (text, signal) => {
        const urls = [...GAS_URLS].sort(() => 0.5 - Math.random());
        for (const url of urls) {
          if (signal?.aborted) throw new Error('Aborted');
          try {
            // 10秒待機
            const res = await Promise.race([
              fetch(`${url}?text=${encodeURIComponent(text)}`, { signal }),
              new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000))
            ]);
            if (!res.ok) continue;
            const textData = await res.text();
            try {
              const data = JSON.parse(textData);
              if (data && data.text) return data.text; // 大文字小文字を維持したまま返す
            } catch (e) {
              console.warn("GAS returned non-JSON response.");
            }
          } catch (e) {
            if (e.name === 'AbortError' || signal?.aborted) throw new Error('Aborted');
            console.warn("GAS translation failed, trying next...");
          }
        }
        
        if (signal?.aborted) throw new Error('Aborted');
        console.warn("Falling back to Google Translate API...");
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=en&dt=t&q=${encodeURIComponent(text)}`, { signal });
        const data = await res.json();
        return data[0][0][0]; // 大文字小文字を維持したまま返す
      };

      const handleTranslateSingle = async (k) => {
        if (!inputs[k].trim()) {
          alert("にゅうりょく してね！");
          return;
        }
        
        if (abortControllers.current[k]) {
          abortControllers.current[k].abort();
        }
        const controller = new AbortController();
        abortControllers.current[k] = controller;
        
        setTranslatingState(prev => ({ ...prev, [k]: true }));
        
        let prefix = "私は";
        let suffix = "に行きました。";
        if (k === 'enjoyed') suffix = "を楽しみました。";
        if (k === 'saw') suffix = "を見ました。";
        if (k === 'ate') suffix = "を食べました。";
        if (k === 'itWas') { prefix = "それは"; suffix = "でした。"; }
        
        const cleanJa = inputs[k].replace(/\s*\(.*?\)\s*/g, ""); 
        const query = `${prefix}${cleanJa}${suffix}`;

        try {
          const enText = await translateWithGAS(query, controller.signal);
          const cleaned = cleanTrans(enText, k);
          setAnswers(prev => ({ ...prev, [k]: { ja: inputs[k], en: cleaned, img: "" } }));
          setTranslatingState(prev => ({ ...prev, [k]: false }));
        } catch (err) {
          if (err.message === 'Aborted' || err.name === 'AbortError') {
            setTranslatingState(prev => ({ ...prev, [k]: false }));
            return;
          }
          setTranslatingState(prev => ({ ...prev, [k]: false }));
        }
      };

      const handleCancelTranslation = (k) => {
        if (abortControllers.current[k]) {
          abortControllers.current[k].abort();
        }
      };

      const copyToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          alert('コピーしました！Googleほんやく に はりつけてね。');
        } catch (err) {
          alert('コピーにしっぱいしました。');
        }
        document.body.removeChild(textArea);
      };

      const startListening = (targetWord, index) => {
        if (!SpeechRecognition) return alert("マイクが使えません。");
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        setIsListening(true);
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const trans = event.results[0][0].transcript.toLowerCase();
          const target = targetWord.split(' ')[0].toLowerCase(); // 最初の単語で判定
          if (trans.includes(target) || trans.length > 10) { 
            setFeedbackMsg("Good! 👏");
            setFailCount(0);
            setTimeout(() => {
              setFeedbackMsg("");
              setCurrentSpeakLine(c => c + 1);
            }, 1500);
          } else {
            setFailCount(c => c + 1);
            setFeedbackMsg("おしい！もう一度！\n(" + trans + " と聞こえました)");
          }
        };
        recognition.onerror = () => { 
          setFailCount(c => c + 1);
          setFeedbackMsg("エラーがおきました。もう一度ボタンをおしてね。"); 
          setIsListening(false); 
        };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const handleFinishAll = () => {
        // スライド完成報酬は10コインのみ。シャケは増やさない。
        saveProgress(totalCoins + 10, items, kummaniLevel, kummaniExp);
        const workData = { date: new Date().toLocaleString(), answers };
        saveWork(workData);
        setViewingWork(workData);
        setStep('VIEW_SLIDESHOW');
        setCurrentSlideIndex(0);
      };

      const buySalmon = () => {
        if (totalCoins >= 10) {
          saveProgress(totalCoins - 10, { ...items, salmon: (items.salmon || 0) + 1 }, kummaniLevel, kummaniExp);
        }
      };

      const feedKummani = () => {
        if (items.salmon >= 1) {
          const newItems = { ...items, salmon: items.salmon - 1 };
          const dish = DISHES[Math.floor(Math.random() * DISHES.length)];
          setFeedEffect({ phase: 'cooking' });
          
          setTimeout(() => {
            setFeedEffect({ phase: 'done', dish });
            setTimeout(() => {
              const newExp = kummaniExp + 1;
              const currentStage = KUMMANI_STAGES.find(s => s.id === kummaniLevel) || KUMMANI_STAGES[0];
              const nextReq = KUMMANI_STAGES.find(s => s.id === kummaniLevel + 1)?.reqExp || 999;
              
              if (newExp >= nextReq) {
                let nextLevel = kummaniLevel + 1;
                if (nextLevel > KUMMANI_STAGES.length) nextLevel = 1;
                const nextStage = KUMMANI_STAGES.find(s => s.id === nextLevel);
                
                setFeedEffect({ phase: 'evolving', from: currentStage, to: nextStage });
                setTimeout(() => {
                  saveProgress(totalCoins, newItems, nextLevel, newExp);
                  setFeedEffect({ phase: 'evolved', to: nextStage });
                  setTimeout(() => setFeedEffect(null), 3000);
                }, 2500);
              } else {
                saveProgress(totalCoins, newItems, kummaniLevel, newExp);
                setFeedEffect(null);
              }
            }, 2000);
          }, 1500);
        }
      };

      // 戻るボタンの処理
      const handleBack = () => {
        switch(step) {
          case 'INPUT': setStep('HOME'); break;
          case 'IMAGE_INPUT': setStep('INPUT'); break;
          case 'NOTE_WRITE': 
            setStep('IMAGE_INPUT'); 
            setShowNoteConfirm(false); 
            break;
          case 'TEACHER_CHECK': setStep('NOTE_WRITE'); break;
          case 'SPEAK_PRACTICE': setStep('TEACHER_CHECK'); break;
          default: setStep('HOME');
        }
      };

      const BackButton = () => (
        <button onClick={handleBack} className="self-start mb-4 bg-white px-4 py-2 rounded-full shadow-sm font-bold text-gray-600 border border-gray-200 hover:bg-gray-50 flex items-center gap-2 z-10 transition">
          <span className="text-xl -mt-1">◀</span> もどる
        </button>
      );

      let content = null;
      const currentStage = KUMMANI_STAGES.find(s => s.id === kummaniLevel) || KUMMANI_STAGES[0];
      const nextStage = KUMMANI_STAGES.find(s => s.id === kummaniLevel + 1);
      
      const renderNoteLines = (ansData, editable = false) => {
        const keys = ['wentTo', 'enjoyed', 'saw', 'ate', 'itWas'];
        return (
          <div className="space-y-6 text-left w-full mt-4">
            {keys.map((k, i) => (
              <div key={k} className="border-b-2 border-dashed border-gray-400 pb-2">
                <div className="text-gray-500 text-sm font-bold mb-1">({ITEM_LABELS[k].title})</div>
                <span className="text-xl md:text-2xl font-note font-bold flex items-center flex-wrap gap-2">
                  <span>{i+1}. {ITEM_LABELS[k].prefix}</span>
                  {editable ? (
                    <input type="text" value={ansData[k].en} onChange={e => setAnswers({...answers, [k]: {...answers[k], en: e.target.value}})} className="border-b-2 border-blue-400 focus:outline-none focus:bg-blue-50 px-2 text-blue-700 bg-transparent min-w-[150px]" />
                  ) : (
                    <span className="text-blue-700 underline decoration-blue-300 decoration-4 underline-offset-4">{ansData[k].en}</span>
                  )}
                  <span>.</span>
                </span>
              </div>
            ))}
          </div>
        );
      };

      if (step === 'HOME') {
        content = (
          <div className="min-h-screen p-4 md:p-8 flex flex-col justify-center relative bg-blue-50 pb-20">
            <div className="bg-red-100 text-red-800 font-bold p-3 rounded-xl mb-4 text-center border-2 border-red-200 text-sm md:text-base">
              ⚠️ ブラウザの履歴を消すとデータが消えます。次の授業まで履歴を消さないように気をつけてね！
            </div>

            {feedEffect && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative">
                  {feedEffect.phase === 'cooking' && <div className="animate-pulse"><div className="text-8xl mb-4">🍳</div><p className="text-2xl font-bold text-orange-600">おりょうり中...</p></div>}
                  {feedEffect.phase === 'done' && <div className="animate-fade-in-up"><div className="text-8xl mb-4">✨🍽️✨</div><p className="text-2xl font-bold text-orange-700 mb-6">{feedEffect.dish}</p><div className="text-7xl animate-bounce mb-2">{currentStage.emoji}</div></div>}
                  {feedEffect.phase === 'evolving' && <div><p className="text-2xl font-bold text-gray-800 mb-8">おや…？</p><div className="text-9xl animate-pulse">{feedEffect.from.emoji}</div></div>}
                  {feedEffect.phase === 'evolved' && <div className="animate-bounce-in"><p className="text-3xl font-extrabold text-yellow-500 mb-8">おめでとう！</p><div className="text-9xl mb-8">{feedEffect.to.emoji}</div><p className="text-2xl font-bold text-gray-800"><span className="text-blue-600 text-3xl">{feedEffect.to.name}</span> に しんかした！</p></div>}
                </div>
              </div>
            )}
            
            <div className="max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-xl border-4 border-blue-200 overflow-hidden">
              <div className="bg-gradient-to-r from-blue-400 to-indigo-500 p-8 text-center text-white">
                <h1 className="text-3xl md:text-4xl font-extrabold drop-shadow-md">おもいで スライドをつくろう！</h1>
                <p className="mt-4 bg-white/20 inline-block px-4 py-2 rounded-full font-bold">🎧 はじめるまえに イヤホンを つけましょう 🎧</p>
              </div>
              <div className="p-6 text-center">
                <button onClick={() => { setInputs({wentTo:'', enjoyed:'', saw:'', ate:'', itWas:''}); setAnswers({}); setTranslatingState({}); setManualInputs({}); setStep('INPUT'); }} className="w-full bg-red-500 hover:bg-red-600 text-white text-2xl font-bold py-6 rounded-2xl shadow-lg transform transition hover:scale-105 mb-8">
                  ▶️ あたらしく つくる！
                </button>
                
                {savedWorks.length > 0 && (
                  <div className="mb-8 text-left bg-gray-50 p-4 rounded-xl border-2 border-gray-200">
                    <h3 className="font-bold text-gray-700 mb-3">📁 つくった さくひん</h3>
                    <div className="space-y-2 max-h-40 overflow-y-auto pr-2">
                      {savedWorks.map((work, idx) => (
                        <div key={idx} className="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border border-gray-100">
                          <span className="text-sm font-bold text-gray-600">{work.date} の作品 ({savedWorks.length - idx})</span>
                          <div className="flex gap-2">
                            <button onClick={() => { setViewingWork(work); setStep('VIEW_WORKSHEET'); }} className="text-sm bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold py-2 px-4 rounded shadow-sm border border-yellow-300">ノート</button>
                            <button onClick={() => { setViewingWork(work); setStep('VIEW_SLIDESHOW'); }} className="text-sm bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 px-4 rounded shadow-sm border border-blue-300">スライド</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                
                <div className="border-t-4 border-dashed border-gray-200 pt-6">
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-xl font-bold text-gray-700">🐻 クッマーニの おせわ</h2>
                    <div className="bg-yellow-100 text-yellow-800 font-bold px-4 py-1 rounded-full border-2 border-yellow-300">🪙 {totalCoins} コイン / 🐟 シャケ: {items.salmon}</div>
                  </div>
                  
                  <div className="flex justify-center mb-4">
                     <button onClick={buySalmon} disabled={totalCoins < 10} className={`py-2 px-6 rounded-xl font-bold shadow text-sm transition ${totalCoins >= 10 ? 'bg-blue-500 hover:bg-blue-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                        🐟 シャケを買う (10コイン)
                     </button>
                  </div>

                  <div className="bg-blue-50 p-6 rounded-2xl border-2 border-blue-100 flex flex-col items-center relative">
                    <div className="text-7xl mb-2 drop-shadow-md">{currentStage.emoji}</div>
                    <div className="font-bold text-blue-800 mb-2">{currentStage.name} (Lv.{currentStage.id})</div>
                    {nextStage ? (
                      <div className="w-full max-w-xs text-xs font-bold text-gray-500 text-right mb-4">つぎまで: {nextStage.reqExp - kummaniExp} EXP</div>
                    ) : (
                      <div className="w-full max-w-xs text-xs font-bold text-orange-500 text-right mb-4">MAX LEVEL (つぎは転生)</div>
                    )}
                    <button onClick={feedKummani} disabled={items.salmon < 1} className={`w-full py-3 rounded-xl font-bold shadow-md text-lg ${items.salmon >= 1 ? 'bg-orange-500 hover:bg-orange-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                      {items.salmon >= 1 ? '🍳 おりょうりして あげる' : 'シャケが ないよ'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      } else if (step === 'INPUT') {
        const isAllTranslated = ['wentTo', 'enjoyed', 'saw', 'ate', 'itWas'].every(k => answers && answers[k] && answers[k].ja === inputs[k]);

        content = (
          <div className="min-h-screen p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-xl text-center pb-24">
              <h2 className="text-2xl font-bold text-pink-700 mb-6 bg-pink-100 py-2 rounded-full border-2 border-pink-200 shadow-sm">なつやすみの おもいで</h2>
              
              {/* 入力欄（直接展開してフォーカス外れを防止） */}
              {['wentTo', 'enjoyed', 'saw', 'ate', 'itWas'].map(k => (
                <div key={k} className="bg-white p-4 md:p-6 rounded-2xl mb-6 border-4 border-pink-100 shadow-md text-left">
                  <h3 className="font-bold text-gray-700 mb-3 text-lg flex items-center">{ITEM_LABELS[k].icon} {ITEM_LABELS[k].title} <span className="text-sm font-normal text-gray-500 ml-2">例: {SUGGESTIONS[k][0]}</span></h3>
                  
                  <input type="text" value={inputs[k]} onChange={e => {
                      setInputs({...inputs, [k]: e.target.value});
                      if (answers && answers[k]) {
                         setAnswers(prev => { const newAns = {...prev}; delete newAns[k]; return newAns; });
                      }
                    }} className="w-full p-4 border-2 border-pink-200 rounded-xl font-bold text-xl focus:outline-none focus:border-pink-400 bg-pink-50 mb-3 transition-colors" />
                  
                  <div className="flex flex-wrap gap-2 mb-4">
                    {SUGGESTIONS[k].map(opt => (
                      <button key={opt} onClick={() => {
                        setInputs({...inputs, [k]: opt});
                        if (answers && answers[k]) {
                           setAnswers(prev => { const newAns = {...prev}; delete newAns[k]; return newAns; });
                        }
                      }} className="text-sm bg-white border border-gray-300 px-3 py-1.5 rounded-full text-gray-600 hover:bg-pink-100 transition-colors">{opt}</button>
                    ))}
                  </div>

                  {answers && answers[k] && answers[k].ja === inputs[k] ? (
                    <div className="bg-green-50 p-4 rounded-xl border-2 border-green-200 mt-4 animate-fade-in-up">
                      <p className="text-sm text-green-700 font-bold mb-1">✨ ほんやく できました！</p>
                      <p className="text-xl md:text-2xl font-bold font-note text-gray-800">{ITEM_LABELS[k].prefix}<span className="text-blue-600 underline decoration-2">{answers[k].en}</span>.</p>
                    </div>
                  ) : translatingState[k] ? (
                    <div className="bg-blue-50 p-4 rounded-xl border-2 border-blue-200 mt-4 text-center">
                      <p className="text-blue-700 font-bold animate-pulse text-lg mb-2">⏳ ほんやく中...</p>
                      <p className="text-sm text-gray-600 mb-4">ほんやくしている間に、ほかの文章を考えよう！💡</p>
                      <button onClick={() => handleCancelTranslation(k)} className="bg-red-400 hover:bg-red-500 text-white font-bold py-2 px-6 rounded-full shadow-sm transition">
                        中止する ✖
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => handleTranslateSingle(k)} className="w-full mt-2 bg-pink-500 hover:bg-pink-600 text-white text-lg font-bold py-4 rounded-xl shadow-md transition transform hover:-translate-y-1">
                      えいごに ほんやく！
                    </button>
                  )}
                  
                  {(!answers || !answers[k] || answers[k].ja !== inputs[k]) && !translatingState[k] && (
                    <div className="bg-red-50 p-5 rounded-xl border-2 border-red-300 mt-6 animate-fade-in-up">
                      <h4 className="font-bold text-red-700 mb-3"><selection-tag>もし、ほんやくが ずっとできないままだったら💦</selection-tag></h4>
                      
                      <p className="text-sm text-gray-700 mb-4 pt-1">Googleほんやくを ひらいて えいごに してみよう！</p>
                      <div className="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 mb-4">
                        <span className="font-bold text-gray-700 truncate mr-2">{inputs[k] || "(にゅうりょくされていません)"}</span>
                        <button onClick={() => copyToClipboard(inputs[k])} className="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded shadow-sm shrink-0">📋 コピー</button>
                      </div>
                      
                      <a href="https://translate.google.co.jp/?sl=ja&tl=en" target="_blank" rel="noopener noreferrer" className="block text-center bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg mb-4 shadow-sm transition">🌐 Googleほんやく をひらく</a>
                      
                      <p className="text-sm font-bold text-gray-600 mb-2">えいごを ここに はりつけ↓</p>
                      <input type="text" value={manualInputs[k] || ''} onChange={e => setManualInputs({...manualInputs, [k]: e.target.value})} className="w-full p-3 border-2 border-gray-300 rounded-lg focus:bg-white bg-gray-50 mb-3 font-bold" />
                      <button onClick={() => {
                        if(!manualInputs[k]) return;
                        setAnswers(prev => ({ ...prev, [k]: { ja: inputs[k], en: cleanTrans(manualInputs[k], k), img: "" } }));
                      }} className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow-sm">けってい！</button>
                    </div>
                  )}
                </div>
              ))}
              
              {isAllTranslated && (
                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t-2 border-pink-100 flex justify-center shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-40">
                  <button onClick={() => setStep('IMAGE_INPUT')} className="w-full max-w-xl bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-5 rounded-2xl shadow-lg transition transform hover:scale-105 animate-bounce-in">
                    つぎへ すすむ！ ▶️
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'IMAGE_INPUT') {
        content = (
          <div className="min-h-screen p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-6 rounded-3xl shadow-xl border-4 border-blue-200 mt-8">
              <h2 className="text-2xl font-bold text-blue-700 mb-4 text-center">スライドの がぞうを さがそう🖼️</h2>
              <div className="bg-blue-50 p-4 rounded-xl mb-6 text-sm font-bold text-gray-700 shadow-inner">
                <ol className="list-decimal pl-5 space-y-2">
                  <li>新しいタブで 画像けんさく をする</li>
                  <li>好きな画像を <span className="text-blue-600 bg-white px-1 rounded border">右クリック</span>（または 長おし）</li>
                  <li>「<span className="text-red-500 bg-white px-1 rounded border">画像アドレスをコピー</span>」をえらぶ</li>
                  <li>下の はこに 貼りつける（ペースト）</li>
                </ol>
              </div>
              
              <div className="space-y-6">
                {['wentTo', 'enjoyed', 'saw', 'ate', 'itWas'].map(k => (
                  <div key={k} className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <p className="font-bold text-gray-700 mb-2">{ITEM_LABELS[k].title} ({answers[k].ja})</p>
                    <input type="text" value={answers[k].img} onChange={e => setAnswers({...answers, [k]: {...answers[k], img: e.target.value}})} placeholder="https://... (ここで 右クリック して はりつけ)" className="w-full p-3 border-2 border-gray-300 rounded-xl text-sm font-bold focus:outline-none focus:border-blue-500 bg-white shadow-inner mb-2" />
                    {answers[k].img && (
                      <div className="relative">
                        <img src={answers[k].img} alt="preview" onError={(e) => {e.target.style.display='none'; e.target.parentElement.innerHTML = '<div class="text-red-500 font-bold bg-red-50 p-2 rounded border border-red-200 text-sm">画像が読み込めません💦 別のアドレスをためしてね！</div>';}} className="h-32 object-cover rounded shadow" />
                      </div>
                    )}
                  </div>
                ))}
              </div>
              <button onClick={() => setStep('NOTE_WRITE')} className="w-full mt-8 bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition transform hover:-translate-y-1">がぞうを いれた！</button>
            </div>
          </div>
        );
      } else if (step === 'NOTE_WRITE') {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-yellow-300 mt-8">
              <h2 className="text-3xl font-bold text-yellow-700 mb-6 text-center">📝 ノートに 書きうつそう！</h2>
              <p className="text-center font-bold text-gray-600 mb-6">下の えいごを、じぶんの ノートに 書いてね。<br/>書きおわったら、先生に チェックしてもらおう！</p>
              
              <div className="bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] bg-white border-2 border-gray-300 p-6 md:p-10 rounded-xl shadow-inner mb-8">
                {renderNoteLines(answers, false)}
              </div>
              
              {!showNoteConfirm ? (
                <button onClick={() => setShowNoteConfirm(true)} className="w-full bg-red-500 hover:bg-red-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition">🙋 先生をよぶ（チェックがめんへ）</button>
              ) : (
                <div className="bg-red-50 p-6 rounded-2xl border-4 border-red-300 animate-fade-in-up shadow-md text-center">
                  <p className="font-bold text-red-700 text-xl mb-6">本当に ノートに ぜんぶ 書きましたか？</p>
                  <div className="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onClick={() => setStep('TEACHER_CHECK')} className="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-xl shadow-md w-full sm:w-1/2 transition">はい！書きました</button>
                    <button onClick={() => setShowNoteConfirm(false)} className="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-4 px-8 rounded-xl shadow-md w-full sm:w-1/2 transition">まだです</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'TEACHER_CHECK') {
        content = (
          <div className="min-h-screen bg-red-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-2xl border-8 border-red-400 relative mt-8">
              <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-2 rounded-full font-bold text-xl shadow-md">先生専用画面</div>
              <p className="text-center font-bold text-gray-700 mt-6 mb-6">児童のノートを確認し、必要であれば以下の英文を手直ししてください。<br/>修正はスライドに反映されます。</p>
              
              <div className="bg-gray-50 border-2 border-gray-300 p-6 rounded-xl mb-8">
                {renderNoteLines(answers, true)}
              </div>
              
              <button onClick={() => setStep('SPEAK_PRACTICE')} className="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition transform hover:-translate-y-1">✅ チェック完了（練習へすすむ）</button>
            </div>
          </div>
        );
      } else if (step === 'SPEAK_PRACTICE') {
        const keys = ['wentTo', 'enjoyed', 'saw', 'ate', 'itWas'];
        const isAllDone = currentSpeakLine >= keys.length;
        
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-green-300 text-center mt-8">
              <h2 className="text-3xl font-bold text-green-700 mb-6">🗣️ えいごで はなす れんしゅう</h2>
              <div className="space-y-4 mb-8">
                {keys.map((k, idx) => {
                  const isActive = idx === currentSpeakLine;
                  const isDone = idx < currentSpeakLine;
                  const sentence = capitalizeFirstLetter(`${ITEM_LABELS[k].prefix}${answers[k].en}.`);
                  return (
                    <div key={k} className={`p-4 rounded-xl border-2 text-left flex justify-between items-center transition-all ${isActive ? 'bg-green-100 border-green-400 transform scale-105 shadow-md' : isDone ? 'bg-gray-100 border-gray-200 opacity-50' : 'bg-white border-gray-200 opacity-40'}`}>
                      <span className={`text-xl md:text-2xl font-bold font-note ${isDone ? 'line-through text-gray-500' : 'text-gray-800'}`}>{idx+1}. {sentence}</span>
                      {isActive && <button onClick={() => speak(sentence)} className="bg-white p-3 rounded-full text-green-600 shadow border border-green-200">🔊</button>}
                      {isDone && <span className="text-green-500 text-3xl">✓</span>}
                    </div>
                  );
                })}
              </div>

              {!isAllDone ? (
                <div>
                  <button onClick={() => startListening(`${answers[keys[currentSpeakLine]].en}`, currentSpeakLine)} disabled={isListening} className={`w-24 h-24 rounded-full shadow-lg text-4xl mb-4 ${isListening ? 'bg-red-500 animate-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white transition`}>🎤</button>
                  <p className="font-bold text-gray-600">{isListening ? "はなしてね..." : "マイクをおして はなす"}</p>
                  {feedbackMsg && <div className="mt-4 p-4 rounded-xl font-bold text-lg border-2 bg-white">{feedbackMsg}</div>}
                  {failCount >= 1 && (
                    <button onClick={() => { setCurrentSpeakLine(c => c+1); setFailCount(0); setFeedbackMsg(""); }} className="mt-6 text-sm text-gray-500 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-full font-bold transition">スキップして次へ ⏭️</button>
                  )}
                </div>
              ) : (
                <div className="animate-bounce-in">
                  <p className="text-2xl font-bold text-orange-500 mb-6">ぜんぶ 言えたね！🎉</p>
                  <button onClick={handleFinishAll} className="w-full bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-6 rounded-2xl shadow-xl transition transform hover:scale-105">スライドを みる！ ▶️</button>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'VIEW_SLIDESHOW') {
        const workData = viewingWork;
        const keys = ['wentTo', 'enjoyed', 'saw', 'ate', 'itWas'];
        const k = keys[currentSlideIndex];
        const sentence = capitalizeFirstLetter(`${ITEM_LABELS[k].prefix}${workData.answers[k].en}.`);
        
        content = (
          <div className="fixed inset-0 bg-black flex flex-col z-50">
            {/* スライド本体エリア（余白を設けてはみ出さないように設計） */}
            <div className="flex-1 flex items-center justify-center p-2 md:p-6 overflow-hidden min-h-0">
              <div className="w-full h-full max-w-6xl rounded-xl md:rounded-3xl overflow-hidden relative flex flex-col bg-gray-900 border-4 border-gray-800 shadow-[0_0_30px_rgba(0,0,0,0.8)]">
                
                <button onClick={() => { setStep('HOME'); setViewingWork(null); }} className="absolute top-4 left-4 bg-black/70 text-white px-4 py-2 rounded-full font-bold z-20 hover:bg-black/90 border border-gray-600 backdrop-blur">✖ とじる</button>
                <button onClick={() => speak(sentence)} className="absolute top-4 right-4 bg-blue-500/90 text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg z-20 hover:bg-blue-600 border-2 border-white backdrop-blur">🔊</button>
                
                {/* 画像（object-containで絶対に画面内に収める） */}
                {workData.answers[k].img ? (
                  <img src={workData.answers[k].img} alt="slide" onError={(e) => {e.target.src="https://placehold.co/800x600/222222/ff3333?text=Error:+Cannot+load+image.\nPlease+try+another+URL.";}} className="absolute inset-0 w-full h-full object-contain z-0" />
                ) : (
                  <div className="absolute inset-0 w-full h-full flex items-center justify-center text-gray-500 font-bold text-2xl z-0">がぞう は ありません</div>
                )}
                
                {/* スライド下部のテキストエリア（pointer-events-noneで邪魔にならないようにし、z-indexで必ず手前に） */}
                <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/80 to-transparent px-4 pt-32 pb-8 md:pb-12 flex flex-col items-center text-center z-10 pointer-events-none">
                  <p className="text-white text-2xl md:text-4xl font-bold font-note drop-shadow-lg leading-tight mb-2">{sentence}</p>
                  <p className="text-gray-300 text-base md:text-xl font-bold drop-shadow-md">({workData.answers[k].ja})</p>
                </div>
              </div>
            </div>
            
            {/* コントロールバー（固定の高さで画面下に配置） */}
            <div className="h-20 bg-gray-950 flex justify-between items-center px-4 md:px-12 shrink-0 border-t border-gray-800">
              <button onClick={() => setCurrentSlideIndex(Math.max(0, currentSlideIndex - 1))} className={`text-white text-3xl md:text-4xl p-2 md:p-4 transition ${currentSlideIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:scale-110 active:scale-95'}`}>◀</button>
              
              <div className="flex gap-3">
                {keys.map((_, i) => (
                  <div key={i} className={`w-3 h-3 md:w-4 md:h-4 rounded-full transition-colors ${i === currentSlideIndex ? 'bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)]' : 'bg-gray-700'}`} />
                ))}
              </div>

              <button onClick={() => setCurrentSlideIndex(Math.min(keys.length - 1, currentSlideIndex + 1))} className={`text-white text-3xl md:text-4xl p-2 md:p-4 transition ${currentSlideIndex === keys.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:scale-110 active:scale-95'}`}>▶</button>
            </div>
          </div>
        );
      } else if (step === 'VIEW_WORKSHEET' && viewingWork) {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-yellow-300 relative mt-8">
              <h2 className="text-2xl font-bold text-gray-700 mb-6">📑 {viewingWork.date} のノート</h2>
              <div className="bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] bg-white border-2 border-gray-300 p-6 md:p-10 rounded-xl shadow-inner mb-4">
                {renderNoteLines(viewingWork.answers, false)}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen relative font-sans touch-manipulation">
          {content}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
